name: Linux package artifacts

on:
  workflow_call:
    inputs:
      app_version:
        description: Release version tag, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.app_version }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm flatpak squashfs-tools snapd libfuse2t64
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.22.3
      - name: Install pinned appimagetool
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              tool_arch=x86_64
              tool_sha256=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              ;;
            arm64)
              tool_arch=aarch64
              tool_sha256=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${tool_arch}.AppImage" \
            --output /tmp/appimagetool
          echo "${tool_sha256}  /tmp/appimagetool" | sha256sum --check --strict -
          chmod +x /tmp/appimagetool
          echo /tmp >> "$GITHUB_PATH"
      - name: Install pinned AppImage runtime
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              runtime_arch=x86_64
              runtime_sha256=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
              ;;
            arm64)
              runtime_arch=aarch64
              runtime_sha256=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
              ;;
          esac
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${runtime_arch}" \
            --output /tmp/appimage-runtime
          printf '%s  /tmp/appimage-runtime\n' "$runtime_sha256" | sha256sum --check --strict -
          chmod +x /tmp/appimage-runtime
          echo "APPIMAGE_RUNTIME_FILE=/tmp/appimage-runtime" >> "$GITHUB_ENV"
      - name: Install Snapcraft 8
        run: sudo snap install snapcraft --classic --channel=8.x/stable
      - name: Install Flatpak runtime
        run: |
          sudo apt-get install --yes flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build Linux packages
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: packaging/linux/build-packages.sh dist/linux
      - name: Smoke-test DEB install and uninstall
        run: |
          package=$(find dist/linux -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install --yes --no-install-recommends "./$package"
          QT_QPA_PLATFORM=offscreen /usr/bin/thunderwatch --smoke-test
          sudo apt-get remove --yes thunderwatch
          test ! -e /usr/bin/thunderwatch
      - name: Smoke-test RPM install and uninstall on Fedora 42
        run: |
          docker run --rm -v "$PWD/dist/linux:/pkgs:ro" fedora:42 bash -euc '
            dnf install -y /pkgs/*.rpm
            QT_QPA_PLATFORM=offscreen /usr/bin/thunderwatch --smoke-test
            dnf remove -y thunderwatch
            test ! -e /usr/bin/thunderwatch
          '
      - name: Smoke-test Flatpak and verify permissions
        run: |
          package=$(find dist/linux -maxdepth 1 -name '*.flatpak' -print -quit)
          test -n "$package"
          flatpak install --user --noninteractive --assumeyes "$package"
          permissions=$(flatpak info --user --show-permissions io.github.jasmeralia.ThunderWatch)
          grep -Fq 'shared=network' <<<"$permissions"
          grep -Fq 'org.kde.StatusNotifierWatcher' <<<"$permissions"
          grep -Fq 'org.freedesktop.secrets' <<<"$permissions"
          ! grep -q '^filesystems=' <<<"$permissions"
          QT_QPA_PLATFORM=offscreen flatpak run --user io.github.jasmeralia.ThunderWatch --smoke-test
      - name: Uninstall Flatpak and verify removal
        if: always()
        run: |
          if flatpak info --user io.github.jasmeralia.ThunderWatch >/dev/null 2>&1; then
            flatpak uninstall --user --delete-data --noninteractive --assumeyes io.github.jasmeralia.ThunderWatch
          fi
          ! flatpak info --user io.github.jasmeralia.ThunderWatch >/dev/null 2>&1
      - name: Smoke-test Snap install and uninstall
        run: |
          package=$(find dist/linux -maxdepth 1 -name '*.snap' -print -quit)
          test -n "$package"
          sudo snap install --dangerous "$package"
          QT_QPA_PLATFORM=offscreen snap run thunderwatch --smoke-test
      - name: Remove Snap and verify removal
        if: always()
        run: |
          if sudo snap list thunderwatch >/dev/null 2>&1; then
            sudo snap remove --purge thunderwatch
          fi
          ! sudo snap list thunderwatch >/dev/null 2>&1
      - name: Smoke-test AppImage
        run: |
          appimage=$(find dist/linux -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen "$appimage" --smoke-test
      - name: Verify package metadata
        run: |
          rpm -qp --info dist/linux/*.rpm >/dev/null
          appimage=$(find dist/linux -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$appimage"
          test -x "$appimage"
          unsquashfs -s dist/linux/*.snap >/dev/null
          test -s dist/linux/*.flatpak
      - name: Create package checksums
        run: (cd dist/linux && sha256sum ThunderWatch-* > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/linux/ThunderWatch-*
            dist/linux/SHA256SUMS
          if-no-files-found: error
