name: CI / release builds

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: Create a beta release from master or rebuild an existing tag
        type: boolean
        default: false

permissions:
  contents: read

# Serialize master builds so each merge gets one version, while PR checks stay independent.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('thunderwatch-pr-{0}', github.event.pull_request.number) || 'thunderwatch-build-release' }}
  queue: max

jobs:
  resolve-release:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Detect a failed release retry
        id: retry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_attempt=$((GITHUB_RUN_ATTEMPT - 1))
          failed_builds=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${previous_attempt}/jobs" \
            --paginate \
            --jq '[.jobs[] | select(.conclusion == "failure" and (.name | startswith("Create or resolve version tag") or startswith("Build Windows") or startswith("Build and smoke-test Linux packages") or startswith("Linux packages (") or startswith("Verify and publish complete beta release"))) | .name] | unique | .[]')
          if [ -n "$failed_builds" ]; then
            echo 'failed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve version and release mode
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          DISPATCH_RELEASE: ${{ inputs.release }}
          RETRY_FAILED_RELEASE: ${{ steps.retry.outputs.failed || 'false' }}
        run: python scripts/release_info.py

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install dependencies
        run: make deps
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true

  create-release-tag:
    name: Create or resolve version tag
    needs: [resolve-release, lint-and-test]
    if: needs.resolve-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create tag on the triggering commit
        if: needs.resolve-release.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}"
          if existing_sha=$(gh api "$ref" --jq '.object.sha' 2>/dev/null); then
            test "$existing_sha" = "$GITHUB_SHA"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --method POST \
              --field "ref=refs/tags/${TAG_NAME}" \
              --field "sha=${GITHUB_SHA}"
          fi
      - name: Confirm tag points to this build
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          test "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" = "${GITHUB_SHA}"

  windows-release:
    name: Build Windows installer
    needs: [lint-and-test, resolve-release, create-release-tag]
    if: >-
      needs.lint-and-test.result == 'success' &&
      needs.resolve-release.outputs.is_release == 'true' &&
      needs.create-release-tag.result == 'success'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-release.outputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Build Windows executable
        env:
          APP_VERSION: ${{ needs.resolve-release.outputs.tag_name }}
        run: python -m PyInstaller build/ThunderWatch.spec --distpath dist --workpath build/tmp
      - name: Smoke-test executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ThunderWatch.exe)) { throw "Missing Windows executable" }
          $proc = Start-Process -FilePath (Resolve-Path 'dist/ThunderWatch.exe').Path -ArgumentList '--smoke-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Executable smoke test failed with exit code $($proc.ExitCode)" }
      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsisX86 = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          $nsisX64 = "${env:ProgramFiles}\NSIS\makensis.exe"
          if (-not ((Test-Path $nsisX86) -or (Test-Path $nsisX64))) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          }
      - name: Build NSIS installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "${env:ProgramFiles}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "makensis.exe not found" }
          & $nsis "/DAPP_VERSION=$env:RELEASE_TAG" build/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          if (-not (Test-Path "dist/ThunderWatch-Setup-$env:RELEASE_TAG.exe")) {
            throw "Missing NSIS installer"
          }
      - name: Smoke-test NSIS install and uninstall
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'ThunderWatch-nsis-smoke'
          $installer = (Resolve-Path "dist/ThunderWatch-Setup-$env:RELEASE_TAG.exe").Path
          $install = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed" }
          $app = Join-Path $installDir 'ThunderWatch.exe'
          if (-not (Test-Path $app)) { throw "Installed executable is missing" }
          if (-not (Test-Path (Join-Path $installDir 'LICENSE'))) { throw "Installed license is missing" }
          $smoke = Start-Process -FilePath $app -ArgumentList '--smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Installed executable smoke test failed" }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS silent uninstall failed" }
          if (Test-Path $app) { throw "Uninstall left the executable installed" }
          if (Test-Path (Join-Path $installDir 'LICENSE')) { throw "Uninstall left the license installed" }
      - name: Create SHA-256 checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag_name }}
        run: |
          $asset = Get-Item -LiteralPath "dist/ThunderWatch-Setup-$env:RELEASE_TAG.exe" -ErrorAction Stop
          $hash = (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($asset.Name)" | Set-Content "$($asset.FullName).sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            dist/ThunderWatch-Setup-${{ needs.resolve-release.outputs.tag_name }}.exe
            dist/ThunderWatch-Setup-${{ needs.resolve-release.outputs.tag_name }}.exe.sha256
          if-no-files-found: error

  linux-packages:
    name: Build and smoke-test Linux packages
    needs: [lint-and-test, resolve-release, create-release-tag]
    if: >-
      needs.lint-and-test.result == 'success' &&
      needs.resolve-release.outputs.is_release == 'true' &&
      needs.create-release-tag.result == 'success'
    uses: ./.github/workflows/linux-packages.yml
    with:
      app_version: ${{ needs.resolve-release.outputs.tag_name }}

  publish-release:
    name: Verify and publish complete beta release
    needs: [resolve-release, create-release-tag, windows-release, linux-packages]
    if: >-
      needs.resolve-release.outputs.is_release == 'true' &&
      needs.create-release-tag.result == 'success' &&
      needs.windows-release.result == 'success' &&
      needs.linux-packages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      TAG_NAME: ${{ needs.resolve-release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.resolve-release.outputs.tag_name }}
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: release-assets/windows
      - uses: actions/download-artifact@v7
        with:
          name: linux-packages-amd64
          path: release-assets/linux-amd64
      - uses: actions/download-artifact@v7
        with:
          name: linux-packages-arm64
          path: release-assets/linux-arm64
      - name: Verify package matrix and checksums
        shell: bash
        run: |
          set -euo pipefail
          windows="ThunderWatch-Setup-${TAG_NAME}.exe"
          test -f "release-assets/windows/${windows}"
          test -f "release-assets/windows/${windows}.sha256"
          (cd release-assets/windows && sha256sum --check --strict "${windows}.sha256")
          cp "release-assets/windows/${windows}" release-assets/
          for arch in amd64 arm64; do
            folder="release-assets/linux-${arch}"
            test -f "${folder}/SHA256SUMS"
            (cd "$folder" && sha256sum --check --strict SHA256SUMS)
            for suffix in deb rpm AppImage flatpak snap; do
              asset="ThunderWatch-${TAG_NAME}-linux-${arch}.${suffix}"
              test -f "${folder}/${asset}"
              cp "${folder}/${asset}" release-assets/
            done
          done
          (cd release-assets && sha256sum ThunderWatch-* > SHA256SUMS)
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
          count=$(find release-assets -maxdepth 1 -type f -name 'ThunderWatch-*' | wc -l)
          test "$count" -eq 11
      - name: Create beta release or verify immutable existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \
            \( -name 'ThunderWatch-*' -o -name 'SHA256SUMS' \) -print | sort)
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            notes_file="$RUNNER_TEMP/supported-platforms.md"
            printf '%s\n' \
              '## Supported platforms' \
              '' \
              '- Windows 10/11 x64 NSIS installer.' \
              '- Linux amd64 and arm64 DEB, RPM, AppImage, Flatpak, and Snap packages.' \
              > "$notes_file"
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag --prerelease --notes-file "$notes_file" --generate-notes
            exit 0
          fi

          # Never replace published bytes or change prerelease/stable metadata on retries.
          mapfile -t existing_names < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          missing=()
          mkdir -p release-assets/existing
          for asset_path in "${assets[@]}"; do
            asset_name=${asset_path#release-assets/}
            if printf '%s\n' "${existing_names[@]}" | grep -Fxq "$asset_name"; then
              gh release download "$TAG_NAME" --pattern "$asset_name" --dir release-assets/existing
              local_file_hash=$(sha256sum "$asset_path" | cut -d ' ' -f 1)
              remote_file_hash=$(sha256sum "release-assets/existing/$asset_name" | cut -d ' ' -f 1)
              if [[ "$local_file_hash" != "$remote_file_hash" ]]; then
                echo "::error::Published asset $asset_name differs from the immutable build artifact."
                exit 1
              fi
            else
              missing+=("$asset_path")
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$TAG_NAME" "${missing[@]}"
          fi
